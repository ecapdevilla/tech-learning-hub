<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoScan - Clasificador Inteligente de Residuos</title>
    <!-- Carga de TensorFlow.js y MobileNet para Visión por Computadora -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: #7f8c8d;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-container {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #111;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ccc;
        }

        video, img#preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #preview {
            display: none;
        }

        .placeholder-text {
            color: #888;
            text-align: center;
            position: absolute;
            padding: 20px;
        }

        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 130px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #3498db;
        }
        .btn-secondary:hover {
            background-color: #2980b9;
        }

        input[type="file"] {
            display: none;
        }

        .result-card {
            width: 100%;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background-color: #f8f9fa;
            border-left: 6px solid #ccc;
            transition: all 0.3s ease;
            display: none;
        }

        .result-card.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .confidence-badge {
            background: #e0e0e0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .instruction {
            font-size: 0.95rem;
            color: #555;
            margin-top: 5px;
            line-height: 1.4;
        }

        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: none;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos específicos de categorías */
        .cat-organico { border-color: #d35400; background-color: #fdf2e9; }
        .cat-organico .category-title { color: #d35400; }

        .cat-plastico { border-color: #f1c40f; background-color: #fef9e7; }
        .cat-plastico .category-title { color: #f39c12; }

        .cat-papel { border-color: #2980b9; background-color: #ebf5fb; }
        .cat-papel .category-title { color: #2980b9; }

        .cat-vidrio { border-color: #27ae60; background-color: #eafaf1; }
        .cat-vidrio .category-title { color: #27ae60; }

        .cat-general { border-color: #7f8c8d; background-color: #f2f4f4; }
        .cat-general .category-title { color: #7f8c8d; }
    </style>
<style>.tlh7bar{max-width:1100px;margin:10px auto;padding:0 12px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-family:Segoe UI,Arial}.tlh7bar a,.tlh7bar span{padding:9px 13px;border-radius:999px;font-weight:900;text-decoration:none}.tlh7bar a{background:#10283f;color:#fff}.tlh7bar span{background:#edf7ff;color:#10283f;border:1px solid #cde3ef}</style></head>
<body><div class="tlh7bar"><a href="../index.html">← Learning Evidence</a><span>7th Grade · Technical Evidence</span></div>

    <header>
        <h1>♻️ EcoScan AI</h1>
        <p>Sistema Inteligente de Clasificación de Residuos</p>
    </header>

    <div class="container">
        <div class="media-container">
            <span class="placeholder-text" id="placeholder">Activa la cámara o sube una foto para analizar el residuo</span>
            <video id="webcam" autoplay playsinline style="display: none;"></video>
            <img id="preview" alt="Vista previa">
        </div>

        <div class="controls">
            <button class="btn" id="btn-webcam">📷 Usar Cámara</button>
            <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📁 Subir Imagen</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="spinner" id="loading"></div>

        <div class="result-card" id="result-card">
            <div class="result-header">
                <span class="category-title" id="category-name">Detectando...</span>
                <span class="confidence-badge" id="confidence">0%</span>
            </div>
            <p class="instruction" id="detected-object">Objeto detectado: --</p>
            <p class="instruction" id="bin-instruction">Instrucciones de reciclaje --</p>
        </div>
    </div>

    <script>
        let model = null;
        const video = document.getElementById('webcam');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('result-card');
        const fileInput = document.getElementById('file-input');
        const btnWebcam = document.getElementById('btn-webcam');
        
        let isWebcamActive = false;
        let streamTrack = null;

        // Reglas de mapeo de palabras clave (en inglés por MobileNet) a categorías ecológicas
        const rules = [
            {
                category: "Orgánico",
                cssClass: "cat-organico",
                bin: "Contenedor Verde / Orgánicos",
                instruction: "Desecha en el contenedor orgánico. Apto para compostaje.",
                keywords: ['apple', 'banana', 'orange', 'fruit', 'vegetable', 'food', 'bread', 'meat', 'sandwich', 'pizza', 'mushroom', 'head cabbage', 'broccoli']
            },
            {
                category: "Plástico / Metal",
                cssClass: "cat-plastico",
                bin: "Contenedor Amarillo / Envases",
                instruction: "Limpia o enjuaga el envase antes de depositarlo para facilitar su reciclaje.",
                keywords: ['bottle', 'water bottle', 'pop bottle', 'plastic', 'can', 'tin', 'soda', 'beer bottle', 'tub', 'container', 'wrapper']
            },
            {
                category: "Papel y Cartón",
                cssClass: "cat-papel",
                bin: "Contenedor Azul / Papel",
                instruction: "Pliega las cajas de cartón. Asegúrate de que no esté sucio de grasa.",
                keywords: ['paper', 'cardboard', 'carton', 'box', 'envelope', 'newspaper', 'book', 'notebook', 'comic book', 'tissue']
            },
            {
                category: "Vidrio",
                cssClass: "cat-vidrio",
                bin: "Contenedor Verde Claro / Vidrio",
                instruction: "Retira los tapones o corchos y deposítalo sin romper.",
                keywords: ['glass', 'wine bottle', 'beer glass', 'goblet', 'jar', 'beaker']
            }
        ];

        // 1. Cargar el Modelo Inteligente
        async function loadModel() {
            try {
                loading.style.display = 'block';
                placeholder.innerText = "Cargando modelo de IA...";
                model = await mobilenet.load();
                placeholder.innerText = "IA lista. Enciende la cámara o sube una foto.";
                loading.style.display = 'none';
            } catch (error) {
                console.error("Error al cargar el modelo", error);
                placeholder.innerText = "Error al cargar el modelo de IA.";
                loading.style.display = 'none';
            }
        }

        loadModel();

        // 2. Control de Cámara
        btnWebcam.addEventListener('click', async () => {
            if (isWebcamActive) {
                stopWebcam();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                streamTrack = stream.getTracks()[0];
                video.style.display = 'block';
                preview.style.display = 'none';
                placeholder.style.display = 'none';
                isWebcamActive = true;
                btnWebcam.innerText = "🛑 Detener Cámara";
                btnWebcam.style.backgroundColor = "#e74c3c";

                // Analizar constantemente mientras la cámara esté activa
                detectWebcamFrame();
            } catch (err) {
                alert("No se pudo acceder a la cámara o no hay permisos suficientes.");
            }
        });

        function stopWebcam() {
            if (streamTrack) streamTrack.stop();
            video.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = "Cámara desactivada.";
            isWebcamActive = false;
            btnWebcam.innerText = "📷 Usar Cámara";
            btnWebcam.style.backgroundColor = "var(--primary)";
        }

        async function detectWebcamFrame() {
            if (!isWebcamActive) return;
            if (model && video.readyState === 4) {
                const predictions = await model.classify(video);
                processPredictions(predictions);
            }
            // Ejecuta el análisis cada 500ms para evitar saturar el procesador
            setTimeout(() => {
                if(isWebcamActive) requestAnimationFrame(detectWebcamFrame);
            }, 500);
        }

        // 3. Procesamiento de Archivo de Imagen
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (isWebcamActive) stopWebcam();

            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.style.display = 'block';
                video.style.display = 'none';
                placeholder.style.display = 'none';

                preview.onload = async () => {
                    if (model) {
                        loading.style.display = 'block';
                        const predictions = await model.classify(preview);
                        loading.style.display = 'none';
                        processPredictions(predictions);
                    }
                };
            };
            reader.readAsDataURL(file);
        });

        // 4. Lógica de Clasificación
        function processPredictions(predictions) {
            if (!predictions || predictions.length === 0) return;

            const topPrediction = predictions[0];
            const detectedName = topPrediction.className.toLowerCase();
            const confidenceScore = Math.round(topPrediction.probability * 100);

            let matchedCategory = null;

            // Buscar coincidencia en las reglas por palabra clave
            for (const rule of rules) {
                if (rule.keywords.some(keyword => detectedName.includes(keyword))) {
                    matchedCategory = rule;
                    break;
                }
            }

            // Si no coincide con ninguna regla estructurada
            if (!matchedCategory) {
                matchedCategory = {
                    category: "Residuo General / No Clasificado",
                    cssClass: "cat-general",
                    bin: "Contenedor Gris / Resto",
                    instruction: "No hemos podido determinar el tipo exacto. Si no es reciclable, deposítalo en el contenedor general."
                };
            }

            updateUI(matchedCategory, topPrediction.className, confidenceScore);
        }

        // 5. Actualizar la Interfaz
        function updateUI(categoryData, rawObjectName, confidence) {
            const card = document.getElementById('result-card');
            
            // Limpiar clases de color previas
            card.className = "result-card active " + categoryData.cssClass;

            document.getElementById('category-name').innerText = categoryData.category;
            document.getElementById('confidence').innerText = `${confidence}% Certeza`;
            document.getElementById('detected-object').innerHTML = `<strong>Objeto detectado:</strong> ${rawObjectName.split(',')[0]}`;
            document.getElementById('bin-instruction').innerHTML = `<strong>Destino:</strong> ${categoryData.bin}<br><small>${categoryData.instruction}</small>`;
        }
    </script>
</body>
</html>
