<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Crypto-Forge 2.0 - Taller de Riqueza</title>
    <style>
        /* ===== ESTILOS COMPLETOS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: #0A0E27;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 45, 117, 0.05) 0%, transparent 50%),
                #0A0E27;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ===== PANEL PRINCIPAL ===== */
        .panel {
            background: rgba(26, 26, 46, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
            margin-bottom: 16px;
        }

        .panel-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
            padding-bottom: 12px;
        }

        .panel-titulo h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #00F0FF, #FF2D75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .panel-titulo .version {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .panel-titulo .nivel {
            font-size: 11px;
            color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        /* ===== SALDO TOTAL ===== */
        .saldo-total {
            text-align: center;
            padding: 16px 0;
            margin-bottom: 16px;
            background: rgba(0, 240, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .saldo-total::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,240,255,0.03), transparent, rgba(255,45,117,0.03), transparent);
            animation: rotateGradient 20s linear infinite;
        }

        @keyframes rotateGradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .saldo-total .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.3);
            position: relative;
            z-index: 1;
        }

        .saldo-total .monto {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 2px 0;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .saldo-total .monto.pequeno {
            font-size: 36px;
        }

        .saldo-total .sub {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            position: relative;
            z-index: 1;
        }

        /* ===== BÓVEDAS ===== */
        .bovedas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .boveda {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .boveda:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .boveda .icono {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }

        .boveda .nombre {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .boveda .cantidad {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .boveda .cambio {
            font-size: 10px;
            display: block;
            margin-top: 2px;
            font-weight: 500;
        }

        .boveda .tooltip {
            font-size: 8px;
            color: rgba(255,255,255,0.2);
            margin-top: 4px;
            display: block;
        }

        .boveda.ahorro { border-color: rgba(57, 255, 20, 0.15); }
        .boveda.ahorro .cantidad { color: #39FF14; }
        .boveda.ahorro:hover { border-color: rgba(57, 255, 20, 0.4); background: rgba(57, 255, 20, 0.05); }

        .boveda.riesgo { border-color: rgba(255, 45, 117, 0.15); }
        .boveda.riesgo .cantidad { color: #FF2D75; }
        .boveda.riesgo:hover { border-color: rgba(255, 45, 117, 0.4); background: rgba(255, 45, 117, 0.05); }

        .boveda.gastos { border-color: rgba(255, 215, 0, 0.15); }
        .boveda.gastos .cantidad { color: #FFD700; }
        .boveda.gastos:hover { border-color: rgba(255, 215, 0, 0.4); background: rgba(255, 215, 0, 0.05); }

        /* ===== BARRA DE PROGRESO ===== */
        .progress-container {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-container .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 6px;
        }

        .progress-container .row .valor {
            color: #fff;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, #FF2D75, #FFD700, #39FF14);
        }

        /* ===== BOTONES ===== */
        .acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-ahorro { border-color: rgba(57, 255, 20, 0.2); color: #39FF14; }
        .btn-ahorro:hover { background: rgba(57, 255, 20, 0.08); border-color: rgba(57, 255, 20, 0.4); }

        .btn-riesgo { border-color: rgba(255, 45, 117, 0.2); color: #FF2D75; }
        .btn-riesgo:hover { background: rgba(255, 45, 117, 0.08); border-color: rgba(255, 45, 117, 0.4); }

        .btn-gastos { border-color: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .btn-gastos:hover { background: rgba(255, 215, 0, 0.08); border-color: rgba(255, 215, 0, 0.4); }

        .btn-minar { 
            border-color: rgba(0, 240, 255, 0.2); 
            color: #00F0FF;
            grid-column: 1 / -1;
        }
        .btn-minar:hover { background: rgba(0, 240, 255, 0.08); border-color: rgba(0, 240, 255, 0.4); }

        .btn-tienda { 
            border-color: rgba(255, 215, 0, 0.15); 
            color: #FFD700;
        }
        .btn-tienda:hover { background: rgba(255, 215, 0, 0.08); border-color: rgba(255, 215, 0, 0.3); }

        .btn-tutorial { 
            border-color: rgba(0, 240, 255, 0.15); 
            color: #00F0FF;
        }
        .btn-tutorial:hover { background: rgba(0, 240, 255, 0.08); border-color: rgba(0, 240, 255, 0.3); }

        .btn-estadisticas { 
            border-color: rgba(255, 255, 255, 0.1); 
            color: rgba(255,255,255,0.5);
        }
        .btn-estadisticas:hover { background: rgba(255,255,255,0.05); }

        .btn-danger { 
            border-color: rgba(255, 0, 77, 0.2); 
            color: #FF004D;
        }
        .btn-danger:hover { background: rgba(255, 0, 77, 0.08); }

        /* ===== MERCADO ===== */
        .mercado {
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .mercado .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mercado .label {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .mercado .status {
            font-size: 14px;
            font-weight: 700;
        }

        .mercado .status.bull { color: #39FF14; }
        .mercado .status.bear { color: #FF004D; }
        .mercado .status.neutral { color: #FFD700; }

        .barra-mercado {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }

        .barra-mercado .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
            background: linear-gradient(90deg, #FF004D, #FFD700, #39FF14);
            width: 50%;
        }

        .barra-mercado .indicadores {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: rgba(255,255,255,0.15);
            margin-top: 4px;
        }

        /* ===== EVENTOS ===== */
        .evento-container {
            min-height: 44px;
            margin-bottom: 12px;
        }

        .evento {
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            animation: slideIn 0.5s ease;
            margin-bottom: 4px;
        }

        .evento.crash {
            background: rgba(255, 0, 77, 0.12);
            border: 1px solid rgba(255, 0, 77, 0.2);
            color: #FF004D;
        }

        .evento.boom {
            background: rgba(57, 255, 20, 0.12);
            border: 1px solid rgba(57, 255, 20, 0.2);
            color: #39FF14;
        }

        .evento.interes {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.15);
            color: #00F0FF;
        }

        .evento.info {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #FFD700;
        }

        .evento.logro {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.25);
            color: #FFD700;
            font-size: 14px;
        }

        @keyframes slideIn {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            flex-wrap: wrap;
            gap: 6px;
        }

        .footer .badge {
            background: rgba(255, 215, 0, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 10px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .footer .badge.verde {
            background: rgba(57, 255, 20, 0.08);
            color: #39FF14;
            border-color: rgba(57, 255, 20, 0.1);
        }

        .footer .badge.rosa {
            background: rgba(255, 45, 117, 0.08);
            color: #FF2D75;
            border-color: rgba(255, 45, 117, 0.1);
        }

        .footer .badge.azul {
            background: rgba(0, 240, 255, 0.08);
            color: #00F0FF;
            border-color: rgba(0, 240, 255, 0.1);
        }

        /* ============================================================
           MINIJUEGO OVERLAY
           ============================================================ */
        .minijuego-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .minijuego-overlay.active {
            display: flex;
        }

        .minijuego-panel {
            background: rgba(26, 26, 46, 0.98);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 80px rgba(0, 240, 255, 0.05);
            animation: modalIn 0.4s ease;
        }

        @keyframes modalIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .minijuego-panel h2 {
            font-size: 24px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #00F0FF, #FF2D75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .minijuego-panel .sub {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 16px;
        }

        .minijuego-panel .explicacion {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            line-height: 1.6;
        }

        .minijuego-panel .explicacion strong {
            color: #00F0FF;
        }

        .bloques {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .bloque {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px;
            font-size: 30px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            user-select: none;
        }

        .bloque:hover {
            border-color: rgba(0, 240, 255, 0.3);
            transform: scale(1.05);
            background: rgba(0, 240, 255, 0.05);
        }

        .bloque.seleccionado {
            border-color: #39FF14;
            background: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.05);
        }

        .bloque.desactivado {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .minijuego-panel .objetivo {
            font-size: 17px;
            color: #FFD700;
            margin: 8px 0 4px 0;
            font-weight: 700;
        }

        .minijuego-panel .resultado {
            font-size: 18px;
            font-weight: 700;
            margin: 12px 0;
            min-height: 30px;
            padding: 8px;
            border-radius: 8px;
        }

        .minijuego-panel .resultado.exito {
            color: #39FF14;
            background: rgba(57, 255, 20, 0.05);
        }

        .minijuego-panel .resultado.fallo {
            color: #FF004D;
            background: rgba(255, 0, 77, 0.05);
        }

        .minijuego-panel .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 8px;
        }

        .minijuego-panel .btn-cerrar {
            padding: 10px 30px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .minijuego-panel .btn-cerrar:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
        }

        /* ============================================================
           TUTORIAL OVERLAY
           ============================================================ */
        .tutorial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.92);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        .tutorial-overlay.active {
            display: flex;
        }

        .tutorial-panel {
            background: rgba(26, 26, 46, 0.98);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.4s ease;
        }

        .tutorial-panel h2 {
            font-size: 22px;
            margin-bottom: 4px;
            color: #00F0FF;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tutorial-panel .sub {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 16px;
        }

        .tutorial-panel .step {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .tutorial-panel .step .num {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            font-weight: 700;
        }

        .tutorial-panel .step h3 {
            font-size: 15px;
            color: #FFD700;
            margin: 2px 0 6px 0;
        }

        .tutorial-panel .step p {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }

        .tutorial-panel .step .ejemplo {
            background: rgba(0, 240, 255, 0.05);
            border-left: 3px solid #00F0FF;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
        }

        .tutorial-panel .btn-continuar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00F0FF, #0088CC);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .tutorial-panel .btn-continuar:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 30px rgba(0, 240, 255, 0.2);
        }

        /* ============================================================
           TIENDA OVERLAY
           ============================================================ */
        .tienda-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 1500;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        .tienda-overlay.active {
            display: flex;
        }

        .tienda-panel {
            background: rgba(26, 26, 46, 0.98);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 24px;
            padding: 24px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.4s ease;
        }

        .tienda-panel h2 {
            font-size: 22px;
            color: #FFD700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tienda-panel .sub {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 16px;
        }

        .tienda-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .tienda-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tienda-item:hover {
            border-color: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            background: rgba(255, 215, 0, 0.03);
        }

        .tienda-item .icono {
            font-size: 28px;
            display: block;
        }

        .tienda-item .nombre {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin: 4px 0;
            font-weight: 600;
        }

        .tienda-item .precio {
            font-size: 13px;
            font-weight: 700;
            color: #FFD700;
        }

        .tienda-item .estado {
            font-size: 10px;
            display: block;
            margin-top: 4px;
        }
