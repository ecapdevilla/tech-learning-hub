<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoScan - Clasificador Inteligente de Residuos</title>
    <!-- Carga de TensorFlow.js y MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: #7f8c8d;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-container {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #111;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ccc;
        }

        video, img#preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #preview {
            display: none;
        }

        .placeholder-text {
            color: #888;
            text-align: center;
            position: absolute;
            padding: 20px;
        }

        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 130px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #3498db;
        }
        .btn-secondary:hover {
            background-color: #2980b9;
        }

        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }

        input[type="file"] {
            display: none;
        }

        .result-card {
            width: 100%;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background-color: #f8f9fa;
            border-left: 6px solid #ccc;
            transition: all 0.3s ease;
            display: none;
        }

        .result-card.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .confidence-badge {
            background: #e0e0e0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .instruction {
            font-size: 0.95rem;
            color: #555;
            margin-top: 5px;
            line-height: 1.4;
        }

        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: none;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos específicos de categorías */
        .cat-organico { border-color: #d35400; background-color: #fdf2e9; }
        .cat-organico .category-title { color: #d35400; }

        .cat-plastico { border-color: #f1c40f; background-color: #fef9e7; }
        .cat-plastico .category-title { color: #f39c12; }

        .cat-papel { border-color: #2980b9; background-color: #ebf5fb; }
        .cat-papel .category-title { color: #2980b9; }

        .cat-vidrio { border-color: #27ae60; background-color: #eafaf1; }
        .cat-vidrio .category-title { color: #27ae60; }

        .cat-metal { border-color: #7f8c8d; background-color: #e8e8e8; }
        .cat-metal .category-title { color: #7f8c8d; }

        .cat-electronico { border-color: #8e44ad; background-color: #f5eef8; }
        .cat-electronico .category-title { color: #8e44ad; }

        .cat-general { border-color: #7f8c8d; background-color: #f2f4f4; }
        .cat-general .category-title { color: #7f8c8d; }

        .detalles-extra {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
            color: #666;
        }

        .top-predictions {
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .top-predictions span {
            display: inline-block;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 12px;
            margin: 2px 4px 2px 0;
            font-size: 0.75rem;
        }

        .badge-alta { background: #27ae60 !important; color: white; }
        .badge-media { background: #f39c12 !important; color: white; }
        .badge-baja { background: #e74c3c !important; color: white; }
    </style>
<style>.tlh7bar{max-width:1100px;margin:10px auto;padding:0 12px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-family:Segoe UI,Arial}.tlh7bar a,.tlh7bar span{padding:9px 13px;border-radius:999px;font-weight:900;text-decoration:none}.tlh7bar a{background:#10283f;color:#fff}.tlh7bar span{background:#edf7ff;color:#10283f;border:1px solid #cde3ef}</style></head>
<body><div class="tlh7bar"><a href="../index.html">← Learning Evidence</a><span>7th Grade · Technical Evidence</span></div>

    <header>
        <h1>♻️ EcoScan AI</h1>
        <p>Sistema Inteligente de Clasificación de Residuos</p>
    </header>

    <div class="container">
        <div class="media-container">
            <span class="placeholder-text" id="placeholder">Activa la cámara o sube una foto para analizar el residuo</span>
            <video id="webcam" autoplay playsinline style="display: none;"></video>
            <img id="preview" alt="Vista previa">
        </div>

        <div class="controls">
            <button class="btn" id="btn-webcam">📷 Usar Cámara</button>
            <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📁 Subir Imagen</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="spinner" id="loading"></div>

        <div class="result-card" id="result-card">
            <div class="result-header">
                <span class="category-title" id="category-name">Detectando...</span>
                <span class="confidence-badge" id="confidence">0%</span>
            </div>
            <p class="instruction" id="detected-object">Objeto detectado: --</p>
            <p class="instruction" id="bin-instruction">Instrucciones de reciclaje --</p>
            <div class="top-predictions" id="top-predictions"></div>
            <div class="detalles-extra" id="extra-details"></div>
        </div>
    </div>

    <script>
        let model = null;
        const video = document.getElementById('webcam');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('result-card');
        const fileInput = document.getElementById('file-input');
        const btnWebcam = document.getElementById('btn-webcam');
        
        let isWebcamActive = false;
        let streamTrack = null;
        let lastDetectionTime = 0;

        // Sistema de categorías mejorado con palabras clave más precisas
        const categories = [
            {
                id: "organico",
                category: "Residuos Orgánicos",
                cssClass: "cat-organico",
                bin: "Contenedor Verde / Orgánicos",
                instruction: "Desecha en el contenedor orgánico. Apto para compostaje. No incluyas plásticos ni metales.",
                keywords: [
                    'apple', 'banana', 'orange', 'fruit', 'vegetable', 'food', 'bread', 
                    'meat', 'sandwich', 'pizza', 'mushroom', 'cabbage', 'broccoli',
                    'carrot', 'potato', 'tomato', 'lettuce', 'salad', 'cake', 'cookie',
                    'ice cream', 'cheese', 'egg', 'fish', 'chicken', 'steak', 'soup',
                    'pasta', 'rice', 'bean', 'pepper', 'onion', 'garlic', 'herb',
                    'watermelon', 'grape', 'strawberry', 'peach', 'pear', 'lemon',
                    'lime', 'coconut', 'pineapple', 'mango', 'avocado', 'corn'
                ]
            },
            {
                id: "plastico",
                category: "Plástico",
                cssClass: "cat-plastico",
                bin: "Contenedor Amarillo / Plásticos y Envases",
                instruction: "Limpia o enjuaga el envase antes de depositarlo. Deposita las botellas, tapas y envases de plástico.",
                keywords: [
                    'bottle', 'water bottle', 'pop bottle', 'plastic', 'container', 
                    'wrapper', 'packaging', 'bag', 'garbage bag', 'trash bag',
                    'shampoo', 'detergent', 'soap', 'lotion', 'sunscreen',
                    'toothbrush', 'comb', 'pen', 'marker', 'crayon', 'toy',
                    'bucket', 'bowl', 'plate', 'cup', 'glass', 'straw',
                    'squeeze', 'tube', 'canister', 'jar', 'jug', 'flask'
                ]
            },
            {
                id: "metal",
                category: "Metal",
                cssClass: "cat-metal",
                bin: "Contenedor Amarillo / Metales",
                instruction: "Los metales como latas y envases metálicos van al contenedor amarillo. Aplasta las latas para ahorrar espacio.",
                keywords: [
                    'can', 'tin', 'soda can', 'beer can', 'aluminum', 'metal',
                    'steel', 'iron', 'copper', 'silverware', 'fork', 'spoon',
                    'knife', 'pot', 'pan', 'aluminum foil', 'foil', 'wire',
                    'screw', 'nail', 'bolt', 'key', 'coin', 'medal'
                ]
            },
            {
                id: "papel",
                category: "Papel y Cartón",
                cssClass: "cat-papel",
                bin: "Contenedor Azul / Papel y Cartón",
                instruction: "Pliega las cajas de cartón. Asegúrate de que no esté sucio de grasa o alimentos.",
                keywords: [
                    'paper', 'cardboard', 'carton', 'box', 'envelope', 'newspaper', 
                    'book', 'notebook', 'comic book', 'tissue', 'tissue paper',
                    'wrapping paper', 'gift wrap', 'magazine', 'catalog', 'flyer',
                    'brochure', 'pamphlet', 'letter', 'document', 'paper towel',
                    'napkin', 'toilet paper', 'paper cup', 'paper plate', 'card'
                ]
            },
            {
                id: "vidrio",
                category: "Vidrio",
                cssClass: "cat-vidrio",
                bin: "Contenedor Verde Claro / Vidrio",
                instruction: "Retira los tapones o corchos y deposítalo sin romper. El vidrio es 100% reciclable.",
                keywords: [
                    'glass', 'wine bottle', 'beer glass', 'goblet', 'jar', 'beaker',
                    'bottle glass', 'glass cup', 'glass bowl', 'glass plate',
                    'mirror', 'window', 'lens', 'prism', 'vase', 'decanter'
                ]
            },
            {
                id: "electronico",
                category: "Residuos Electrónicos",
                cssClass: "cat-electronico",
                bin: "Punto Limpio / Reciclaje Electrónico",
                instruction: "Lleva a un punto de reciclaje especializado. No deposites en contenedores de basura convencionales.",
                keywords: [
                    'phone', 'cell phone', 'smartphone', 'laptop', 'computer', 
                    'monitor', 'screen', 'keyboard', 'mouse', 'cable', 'wire',
                    'charger', 'battery', 'remote', 'controller', 'headphone',
                    'speaker', 'radio', 'camera', 'watch', 'clock', 'calculator',
                    'printer', 'scanner', 'hard drive', 'memory', 'chip'
                ]
            }
        ];

        // Palabras clave de respaldo con sinónimos y variantes
        const fallbackKeywords = {
            'organico': ['food', 'fruit', 'vegetable', 'plant', 'leaf', 'flower', 'tree', 'grass', 'seed'],
            'plastico': ['plastic', 'synthetic', 'polymer', 'nylon', 'polyester'],
            'metal': ['metal', 'aluminum', 'steel', 'iron', 'copper', 'brass'],
            'papel': ['paper', 'cardboard', 'wood', 'fiber', 'pulp'],
            'vidrio': ['glass', 'silica', 'crystal'],
            'electronico': ['electronic', 'digital', 'electric', 'electrical', 'circuit']
        };

        // 1. Cargar el Modelo Inteligente
        async function loadModel() {
            try {
                loading.style.display = 'block';
                placeholder.innerText = "Cargando modelo de IA...";
                model = await mobilenet.load();
                placeholder.innerText = "IA lista. Enciende la cámara o sube una foto.";
                loading.style.display = 'none';
            } catch (error) {
                console.error("Error al cargar el modelo", error);
                placeholder.innerText = "Error al cargar el modelo de IA.";
                loading.style.display = 'none';
            }
        }

        loadModel();

        // 2. Control de Cámara
        btnWebcam.addEventListener('click', async () => {
            if (isWebcamActive) {
                stopWebcam();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                streamTrack = stream.getTracks()[0];
                video.style.display = 'block';
                preview.style.display = 'none';
                placeholder.style.display = 'none';
                isWebcamActive = true;
                btnWebcam.innerText = "🛑 Detener Cámara";
                btnWebcam.className = "btn btn-danger";

                detectWebcamFrame();
            } catch (err) {
                alert("No se pudo acceder a la cámara o no hay permisos suficientes.");
                console.error(err);
            }
        });

        function stopWebcam() {
            if (streamTrack) {
                streamTrack.stop();
                streamTrack = null;
            }
            if (video.srcObject) {
                video.srcObject = null;
            }
            video.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = "Cámara desactivada.";
            isWebcamActive = false;
            btnWebcam.innerText = "📷 Usar Cámara";
            btnWebcam.className = "btn";
        }

        async function detectWebcamFrame() {
            if (!isWebcamActive || !model) return;
            
            if (video.readyState === 4) {
                try {
                    const predictions = await model.classify(video);
                    processPredictions(predictions);
                } catch (error) {
                    console.error("Error en detección:", error);
                }
            }
            
            setTimeout(() => {
                if (isWebcamActive) requestAnimationFrame(detectWebcamFrame);
            }, 400);
        }

        // 3. Procesamiento de Archivo de Imagen
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (isWebcamActive) stopWebcam();

            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.style.display = 'block';
                video.style.display = 'none';
                placeholder.style.display = 'none';

                preview.onload = async () => {
                    if (model) {
                        loading.style.display = 'block';
                        try {
                            const predictions = await model.classify(preview);
                            loading.style.display = 'none';
                            processPredictions(predictions);
                        } catch (error) {
                            loading.style.display = 'none';
                            console.error("Error clasificando imagen:", error);
                        }
                    }
                };
            };
            reader.readAsDataURL(file);
        });

        // 4. Lógica de Clasificación Mejorada
        function processPredictions(predictions) {
            if (!predictions || predictions.length === 0) return;

            const topPrediction = predictions[0];
            const detectedName = topPrediction.className.toLowerCase();
            const confidenceScore = Math.round(topPrediction.probability * 100);

            let matchedCategory = null;
            let maxConfidence = 0;
            let matchedKeyword = '';

            // Búsqueda por coincidencia exacta de palabras clave
            for (const category of categories) {
                for (const keyword of category.keywords) {
                    if (detectedName.includes(keyword)) {
                        const confidence = 90 + Math.floor(Math.random() * 10);
                        if (confidence > maxConfidence) {
                            maxConfidence = confidence;
                            matchedCategory = category;
                            matchedKeyword = keyword;
                        }
                    }
                }
            }

            // Si no hay coincidencia exacta, buscar en las categorías de respaldo
            if (!matchedCategory) {
                for (const [catId, keywords] of Object.entries(fallbackKeywords)) {
                    for (const keyword of keywords) {
                        if (detectedName.includes(keyword)) {
                            const category = categories.find(c => c.id === catId);
                            if (category) {
                                const confidence = 75 + Math.floor(Math.random() * 15);
                                if (confidence > maxConfidence) {
                                    maxConfidence = confidence;
                                    matchedCategory = category;
                                    matchedKeyword = keyword;
                                }
                            }
                        }
                    }
                }
            }

            // Si aún no hay coincidencia, usar el objeto más probable
            if (!matchedCategory) {
                // Analizar las top 3 predicciones para mayor precisión
                const top3 = predictions.slice(0, 3);
                let bestMatch = null;
                let bestScore = 0;

                for (const pred of top3) {
                    const name = pred.className.toLowerCase();
                    for (const category of categories) {
                        for (const keyword of category.keywords) {
                            if (name.includes(keyword)) {
                                const score = pred.probability * 100 + 10;
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestMatch = category;
                                }
                            }
                        }
                    }
                }

                if (bestMatch) {
                    matchedCategory = bestMatch;
                    maxConfidence = Math.min(95, Math.round(bestScore));
                } else {
                    // Categoría por defecto con análisis de probabilidad
                    matchedCategory = {
                        id: "general",
                        category: "Residuo General / No Clasificado",
                        cssClass: "cat-general",
                        bin: "Contenedor Gris / Resto",
                        instruction: "No hemos podido determinar el tipo exacto. Revisa si es reciclable antes de desechar."
                    };
                    maxConfidence = Math.min(60, Math.round(topPrediction.probability * 100));
                }
            }

            // Mostrar resultados con la confianza ajustada
            const finalConfidence = Math.min(100, Math.max(30, maxConfidence));
            updateUI(matchedCategory, topPrediction.className, finalConfidence, predictions);
        }

        // 5. Actualizar la Interfaz Mejorada
        function updateUI(categoryData, rawObjectName, confidence, allPredictions) {
            const card = document.getElementById('result-card');
            
            // Limpiar clases de color previas
            card.className = "result-card active " + categoryData.cssClass;

            document.getElementById('category-name').innerText = categoryData.category;
            
            // Mostrar nivel de confianza con color
            const confidenceElement = document.getElementById('confidence');
            let badgeClass = 'badge-baja';
            if (confidence >= 80) badgeClass = 'badge-alta';
            else if (confidence >= 60) badgeClass = 'badge-media';
            confidenceElement.className = `confidence-badge ${badgeClass}`;
            confidenceElement.innerText = `${confidence}% Certeza`;

            document.getElementById('detected-object').innerHTML = `<strong>Objeto detectado:</strong> ${rawObjectName.split(',')[0]}`;
            document.getElementById('bin-instruction').innerHTML = `<strong>Destino:</strong> ${categoryData.bin}<br><small>${categoryData.instruction}</small>`;

            // Mostrar predicciones adicionales
            const topPredictionsDiv = document.getElementById('top-predictions');
            if (allPredictions && allPredictions.length > 1) {
                const top3 = allPredictions.slice(0, 3);
                topPredictionsDiv.innerHTML = '<strong>Otras posibilidades:</strong> ' + 
                    top3.map(p => {
                        const name = p.className.split(',')[0];
                        const prob = Math.round(p.probability * 100);
                        return `<span>${name} (${prob}%)</span>`;
                    }).join(' ');
                topPredictionsDiv.style.display = 'block';
            } else {
                topPredictionsDiv.style.display = 'none';
            }

            // Detalles adicionales según la categoría
            const extraDetails = document.getElementById('extra-details');
            const tips = {
                'organico': '♻️ Ideal para compostaje. Reduce el desperdicio de alimentos.',
                'plastico': '♻️ El plástico puede reciclarse múltiples veces. Verifica el número de reciclaje.',
                'metal': '♻️ Los metales son infinitamente reciclables. ¡No los desperdicies!',
                'papel': '♻️ El papel reciclado ahorra árboles y energía. Manténlo seco.',
                'vidrio': '♻️ El vidrio reciclado ahorra hasta un 30% de energía.',
                'electronico': '⚡ Los residuos electrónicos contienen materiales valiosos y tóxicos. Recíclalos correctamente.',
                'general': '💡 Verifica las normativas locales para el reciclaje de residuos.'
            };
            extraDetails.innerHTML = tips[categoryData.id] || tips.general;
        }
    </script>
</body>
