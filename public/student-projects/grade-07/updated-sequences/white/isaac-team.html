<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 EcoJuego · Alvaran & Saac</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #0b3b2c 0%, #1a5a3a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .game-card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 248, 235, 0.9);
      backdrop-filter: blur(6px);
      border-radius: 4rem 2rem 4rem 2rem;
      box-shadow: 0 25px 40px rgba(0, 20, 10, 0.6), 0 0 0 2px #b8d9b0 inset;
      padding: 2rem 2rem 2.5rem;
      transition: 0.3s;
      border: 1px solid #d4e8c0;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      gap: 0.6rem 1rem;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .title-group h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1f4f2b;
      text-shadow: 2px 2px 0 #b3d9a0;
      margin: 0;
      line-height: 1.1;
    }

    .title-group .icon-leaf {
      font-size: 2.6rem;
      filter: drop-shadow(0 4px 4px rgba(0,40,10,0.3));
    }

    .creators {
      background: #1d4d2b;
      padding: 0.5rem 1.6rem;
      border-radius: 60px;
      color: #f2ffe6;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #0a2818;
      border: 1px solid #7fb081;
      display: inline-flex;
      gap: 0.3rem;
      align-items: center;
    }

    .creators span {
      background: #e9f7da;
      color: #1f4a1f;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .score-panel {
      background: #1b4028;
      border-radius: 80px;
      padding: 0.6rem 1.6rem;
      color: #f1ffe0;
      font-weight: 600;
      font-size: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 4px 0 #0a2818;
      border: 1px solid #7fb081;
      margin-bottom: 1.5rem;
    }

    .score-panel span {
      background: #f7ffe0;
      color: #174021;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      font-size: 1.8rem;
      min-width: 3.4rem;
      text-align: center;
    }

    .game-area {
      background: #dcedc8;
      background-image: radial-gradient(circle at 30% 40%, #e8f5d9 10%, #bfddaf 90%);
      border-radius: 4rem 2rem 2rem 2rem;
      padding: 2rem 1.5rem 1.5rem;
      box-shadow: inset 0 -8px 0 #5d7e4e, 0 10px 20px rgba(0,0,0,0.2);
      border: 2px solid #88a87a;
      margin-bottom: 2rem;
      transition: 0.2s;
    }

    .message-box {
      background: #2b5a38;
      color: #f5ffe0;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 1.6rem;
      border: 1px solid #b3d8a2;
      box-shadow: 0 4px 0 #14301b;
      letter-spacing: 0.3px;
    }

    .items-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem 1.8rem;
      margin: 1.8rem 0 1rem;
    }

    .item-card {
      background: #f6ffef;
      border-radius: 40px 20px 40px 20px;
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 2rem;
      font-weight: 600;
      color: #1f3d1a;
      box-shadow: 0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2);
      border: 2px solid #aec99b;
      cursor: pointer;
      transition: all 0.08s linear;
      min-width: 120px;
      justify-content: center;
    }

    .item-card:active {
      transform: scale(0.94);
      box-shadow: 0 3px 0 #3f5f2f;
    }

    .item-card span {
      font-size: 1.8rem;
    }

    .item-card .emoji-big {
      font-size: 2.6rem;
      line-height: 1;
    }

    .bin-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 2.5rem;
      margin: 2.2rem 0 1rem;
    }

    .bin {
      background: #4a6d3d;
      padding: 0.4rem 1.2rem 0.8rem;
      border-radius: 40px 40px 20px 20px;
      min-width: 100px;
      text-align: center;
      box-shadow: 0 8px 0 #1f3a1a, 0 8px 12px rgba(0,0,0,0.3);
      border: 2px solid #89b07a;
      cursor: pointer;
      transition: 0.06s linear;
      flex: 0 1 auto;
    }

    .bin:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1f3a1a;
    }

    .bin .bin-icon {
      font-size: 3rem;
      line-height: 1.2;
      filter: drop-shadow(0 6px 4px #1e3118);
    }

    .bin .bin-label {
      display: block;
      background: #e6f5da;
      color: #1c3a1a;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      margin-top: 2px;
      border: 1px solid #b3d3a0;
    }

    .reset-btn {
      background: #ea9b6b;
      border: none;
      border-radius: 60px;
      padding: 0.8rem 2.2rem;
      font-weight: 700;
      font-size: 1.2rem;
      color: #1d311b;
      box-shadow: 0 6px 0 #8f5e3a;
      cursor: pointer;
      transition: 0.06s linear;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.2rem;
      border: 1px solid #f6d8b0;
      background: #f3b881;
      letter-spacing: 1px;
    }

    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8f5e3a;
    }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      color: #14301a;
      font-weight: 500;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      border-top: 2px dashed #6f9360;
      padding-top: 1.8rem;
    }

    .footer-note strong {
      background: #dcedc8;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 1.1rem;
    }

    @media (max-width: 550px) {
      .game-card { padding: 1.5rem; }
      .title-group h1 { font-size: 2rem; }
      .creators { font-size: 1rem; padding: 0.3rem 1rem; }
      .bin { min-width: 70px; }
      .item-card { min-width: 90px; }
    }
  </style>
</head>
<body>
  <div class="game-card">
    <!-- Header con nombres Alvaran & Saac -->
    <div class="header">
      <div class="title-group">
        <span class="icon-leaf">🌿</span>
        <h1>EcoRecicla</h1>
      </div>
      <div class="creators">
        👥 <span>Alvaran</span> & <span>Saac</span>
      </div>
    </div>

    <!-- Panel de puntuación -->
    <div class="score-panel">
      🏆 Puntos <span id="scoreDisplay">0</span>
    </div>

    <!-- Área del juego -->
    <div class="game-area">
      <div id="messageBox" class="message-box">
        🌎 ¡Arrastra o toca el residuo y elige el contenedor!
      </div>

      <!-- Items (residuos) -->
      <div id="itemsContainer" class="items-container">
        <!-- Los items se generan dinámicamente con JS -->
      </div>

      <!-- Contenedores (bins) -->
      <div class="bin-area">
        <div class="bin" data-bin="organico" id="binOrganico">
          <div class="bin-icon">🍂</div>
          <span class="bin-label">Orgánico</span>
        </div>
        <div class="bin" data-bin="reciclable" id="binReciclable">
          <div class="bin-icon">♻️</div>
          <span class="bin-label">Reciclable</span>
        </div>
        <div class="bin" data-bin="vidrio" id="binVidrio">
          <div class="bin-icon">🫙</div>
          <span class="bin-label">Vidrio</span>
        </div>
      </div>

      <!-- Botón reiniciar -->
      <div style="display: flex; justify-content: center;">
        <button id="resetGameBtn" class="reset-btn">🔄 Nuevo juego</button>
      </div>
    </div>

    <!-- Footer con nombres nuevamente -->
    <div class="footer-note">
      <span>🌱</span>
      <strong>Alvaran · Saac</strong>
      <span>♻️</span>
      <span style="opacity:0.8;">juego ambiental</span>
    </div>
  </div>

  <script>
    (function() {
      // ---- DATOS DEL JUEGO ----
      const itemsData = [
        { id: 0, emoji: '🍎', name: 'Manzana', tipo: 'organico' },
        { id: 1, emoji: '🥕', name: 'Zanahoria', tipo: 'organico' },
        { id: 2, emoji: '📄', name: 'Papel', tipo: 'reciclable' },
        { id: 3, emoji: '🥫', name: 'Lata', tipo: 'reciclable' },
        { id: 4, emoji: '🍾', name: 'Botella', tipo: 'vidrio' },
        { id: 5, emoji: '🫙', name: 'Frasco', tipo: 'vidrio' }
      ];

      // Estado del juego
      let currentItems = [];           // elementos activos { id, emoji, name, tipo }
      let score = 0;
      let gameFinished = false;

      // Referencias DOM
      const scoreDisplay = document.getElementById('scoreDisplay');
      const messageBox = document.getElementById('messageBox');
      const itemsContainer = document.getElementById('itemsContainer');
      const resetBtn = document.getElementById('resetGameBtn');

      // Elementos contenedores (bins)
      const binElements = {
        organico: document.getElementById('binOrganico'),
        reciclable: document.getElementById('binReciclable'),
        vidrio: document.getElementById('binVidrio')
      };

      // ---- FUNCIONES AUXILIARES ----
      function updateScoreUI() {
        scoreDisplay.textContent = score;
      }

      function setMessage(text, isSuccess = true) {
        messageBox.textContent = text;
        messageBox.style.background = isSuccess ? '#2b5a38' : '#7a3e2b';
        messageBox.style.color = '#f5ffe0';
        if (!isSuccess) {
          messageBox.style.background = '#7a3e2b';
          messageBox.style.color = '#fff5e0';
        } else {
          messageBox.style.background = '#2b5a38';
          messageBox.style.color = '#f5ffe0';
        }
        // reset después de un rato si no es final
        if (!gameFinished) {
          setTimeout(() => {
            if (!gameFinished) {
              messageBox.textContent = '🌎 Toca un residuo y luego el contenedor adecuado.';
              messageBox.style.background = '#2b5a38';
              messageBox.style.color = '#f5ffe0';
            }
          }, 1800);
        }
      }

      // Verifica si todos los items han sido eliminados (juego terminado)
      function checkGameFinished() {
        if (currentItems.length === 0 && !gameFinished) {
          gameFinished = true;
          messageBox.textContent = '🎉 ¡Felicidades! Has reciclado todo. 🌍♻️';
          messageBox.style.background = '#1d6b3c';
          messageBox.style.color = '#f0ffe0';
          // Mostrar mensaje especial con los nombres
          setTimeout(() => {
            messageBox.textContent = '✨ ¡Gracias Alvaran & Saac por salvar el planeta! ✨';
          }, 2500);
        }
        return currentItems.length === 0;
      }

      // Renderiza los items en el contenedor
      function renderItems() {
        itemsContainer.innerHTML = '';
        if (currentItems.length === 0) {
          // Si no hay items, mostramos un mensaje (pero ya se maneja en check)
          const emptyMsg = document.createElement('div');
          emptyMsg.style.width = '100%';
          emptyMsg.style.textAlign = 'center';
          emptyMsg.style.padding = '1.2rem';
          emptyMsg.style.fontSize = '1.4rem';
          emptyMsg.style.color = '#1f3d1a';
          emptyMsg.style.fontWeight = 'bold';
          emptyMsg.textContent = '🌱 ¡Todo reciclado! 🌱';
          itemsContainer.appendChild(emptyMsg);
          return;
        }

        currentItems.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.dataset.id = item.id;
          card.dataset.tipo = item.tipo;
          card.innerHTML = `
            <span class="emoji-big">${item.emoji}</span>
            <span>${item.name}</span>
          `;
          // Evento: al hacer click en un item, lo "seleccionamos" para luego tirar al contenedor
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameFinished) {
              setMessage('🎯 El juego ya terminó, presiona "Nuevo juego"', false);
              return;
            }
            // Resaltar el item seleccionado (quitamos resaltado de otros)
            document.querySelectorAll('.item-card').forEach(c => c.style.boxShadow = '0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2)');
            card.style.boxShadow = '0 0 0 4px #ffe484, 0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2)';
            // Guardamos el item seleccionado en una variable global (o dataset)
            window._selectedItemId = item.id;
            setMessage(`✋ Seleccionaste: ${item.emoji} ${item.name}. Elige un contenedor.`, true);
          });
          itemsContainer.appendChild(card);
        });
      }

      // Función para reciclar un item (lo elimina y suma puntos)
      function recycleItem(itemId, binType) {
        if (gameFinished) {
          setMessage('⛔ El juego ya terminó. Reinicia para jugar.', false);
          return false;
        }

        // Buscar el item en currentItems
        const itemIndex = currentItems.findIndex(it => it.id === itemId);
        if (itemIndex === -1) {
          setMessage('❌ Este residuo ya fue reciclado.', false);
          return false;
        }

        const item = currentItems[itemIndex];
        // Verificar si el tipo coincide con el contenedor
        if (item.tipo !== binType) {
          setMessage(`❌ ¡Error! ${item.emoji} no va en ese contenedor.`, false);
          // Quitar resaltado del item
          document.querySelectorAll('.item-card').forEach(c => c.style.boxShadow = '0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2)');
          return false;
        }

        // ¡Reciclaje correcto!
        // Eliminar item del array
        currentItems.splice(itemIndex, 1);
        score += 10;
        updateScoreUI();

        // Quitar resaltado
        document.querySelectorAll('.item-card').forEach(c => c.style.boxShadow = '0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2)');

        // Mensaje de éxito
        setMessage(`✅ ¡Bien! ${item.emoji} reciclado correctamente. +10 pts`, true);

        // Re-renderizar items
        renderItems();

        // Verificar si el juego terminó
        checkGameFinished();

        // Limpiar selección
        window._selectedItemId = null;
        return true;
      }

      // ---- EVENTOS DE CONTENEDORES (BINS) ----
      function setupBinListeners() {
        // Orgánico
        binElements.organico.addEventListener('click', function(e) {
          e.stopPropagation();
          const selectedId = window._selectedItemId;
          if (selectedId === undefined || selectedId === null) {
            setMessage('👆 Primero toca un residuo para seleccionarlo.', false);
            return;
          }
          recycleItem(selectedId, 'organico');
          window._selectedItemId = null; // limpiar después de intentar
        });

        // Reciclable
        binElements.reciclable.addEventListener('click', function(e) {
          e.stopPropagation();
          const selectedId = window._selectedItemId;
          if (selectedId === undefined || selectedId === null) {
            setMessage('👆 Primero toca un residuo para seleccionarlo.', false);
            return;
          }
          recycleItem(selectedId, 'reciclable');
          window._selectedItemId = null;
        });

        // Vidrio
        binElements.vidrio.addEventListener('click', function(e) {
          e.stopPropagation();
          const selectedId = window._selectedItemId;
          if (selectedId === undefined || selectedId === null) {
            setMessage('👆 Primero toca un residuo para seleccionarlo.', false);
            return;
          }
          recycleItem(selectedId, 'vidrio');
          window._selectedItemId = null;
        });
      }

      // ---- REINICIAR JUEGO ----
      function resetGame() {
        // Reiniciar estado
        currentItems = itemsData.map(item => ({ ...item })); // copia profunda
        score = 0;
        gameFinished = false;
        window._selectedItemId = null;
        updateScoreUI();
        renderItems();
        setMessage('🌱 ¡Nueva partida! Recicla todos los residuos.', true);
        messageBox.style.background = '#2b5a38';
        messageBox.style.color = '#f5ffe0';
        // Quitar resaltados
        document.querySelectorAll('.item-card').forEach(c => c.style.boxShadow = '0 8px 0 #5f7e4f, 0 6px 12px rgba(0,0,0,0.2)');
        // Asegurar que no haya mensaje de game over
      }

      // ---- INICIALIZACIÓN ----
      function initGame() {
        // Cargar datos iniciales
        currentItems = itemsData.map(item => ({ ...item }));
        score = 0;
        gameFinished = false;
        window._selectedItemId = null;
        updateScoreUI();
        renderItems();
        setMessage('🌍 ¡Selecciona un residuo y luego el contenedor!', true);
        setupBinListeners();
        resetBtn.addEventListener('click', resetGame);
      }

      initGame();
    })();
  </script>
</body>
</html>
