<div class="integrantes">
    <strong>Integrantes del grupo:</strong><br>
    Luis<br>
    Santiago<br>
    Effer
</div>

<form id="quiz">

<div class="pregunta">
<h3>1. ¿Qué se utiliza para guardar información en un programa?</h3>

<label><input type="radio" name="p1" value="a"> Variable</label><br>
<label><input type="radio" name="p1" value="b"> Pantalla</label><br>
<label><input type="radio" name="p1" value="c"> Teclado</label>
</div>

<div class="pregunta">
<h3>2. ¿Qué estructura permite tomar decisiones?</h3>

<label><input type="radio" name="p2" value="a"> if</label><br>
<label><input type="radio" name="p2" value="b"> print</label><br>
<label><input type="radio" name="p2" value="c"> alert</label>
</div>

<div class="pregunta">
<h3>3. ¿Cuál es un ejemplo de un bucle?</h3>

<label><input type="radio" name="p3" value="a"> for</label><br>
<label><input type="radio" name="p3" value="b"> else</label><br>
<label><input type="radio" name="p3" value="c"> switch</label>
</div>

<div class="pregunta">
<h3>4. ¿Qué hace un bucle?</h3>

<label><input type="radio" name="p4" value="a"> Repite instrucciones</label><br>
<label><input type="radio" name="p4" value="b"> Apaga la computadora</label><br>
<label><input type="radio" name="p4" value="c"> Borra archivos</label>
</div>

<button type="button" onclick="calificar()">Enviar respuestas</button>

</form>

<div id="resultado"></div>

</div>

<script>

// Variable con las respuestas correctas
const respuestasCorrectas = ["a","a","a","a"];

function calificar(){

    let respuestasUsuario = [];
    let puntaje = 0;

    // Bucle para obtener las respuestas
    for(let i = 1; i <= 4; i++){

        let opcion = document.querySelector('input[name="p' + i + '"]:checked');

        if(opcion){
            respuestasUsuario.push(opcion.value);
        }else{
            respuestasUsuario.push("");
        }
    }

    // Bucle y condicional para comparar respuestas
    for(let i = 0; i < respuestasCorrectas.length; i++){

        if(respuestasUsuario[i] === respuestasCorrectas[i]){
            puntaje++;
        }

    }

    let mensaje = "";

    // Condicionales para mostrar el resultado
    if(puntaje === 4){
        mensaje = "🏆 ¡Excelente! Obtuviste 4 de 4 respuestas correctas.";
    }else if(puntaje >= 2){
        mensaje = "👍 Buen trabajo. Obtuviste " + puntaje + " de 4 respuestas correctas.";
    }else{
        mensaje = "📚 Sigue practicando. Obtuviste " + puntaje + " de 4 respuestas correctas.";
    }

    document.getElementById("resultado").innerHTML = mensaje;
