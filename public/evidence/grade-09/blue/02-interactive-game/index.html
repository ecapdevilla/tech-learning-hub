<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego Interactivo - Atrapa las Estrellas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298,#6dd5fa);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contenedor{
    width:900px;
    max-width:95%;
    background:white;
    border-radius:20px;
    box-shadow:0px 0px 25px rgba(0,0,0,.4);
    overflow:hidden;
}

header{
    background:#0d47a1;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:10px;
}

.info{
    display:flex;
    justify-content:space-around;
    padding:15px;
    background:#e3f2fd;
    font-size:20px;
    font-weight:bold;
}

#game{
    position:relative;
    height:450px;
    background:linear-gradient(#87CEEB,#dff6ff);
    overflow:hidden;
    cursor:crosshair;
}

.star{
    position:absolute;
    font-size:40px;
    cursor:pointer;
    transition:transform .2s;
    user-select:none;
}

.star:hover{
    transform:scale(1.3);
}

button{
    display:block;
    margin:20px auto;
    padding:15px 35px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#fb8c00;
    transform:scale(1.05);
}

footer{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:20px;
}

.integrantes{
    margin-top:10px;
    line-height:30px;
    font-size:18px;
}

#mensajeFinal{
    text-align:center;
    font-size:28px;
    color:#0d47a1;
    padding:20px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="contenedor">

<header>

<h1>⭐ ATRAPA LAS ESTRELLAS ⭐</h1>

<p>Haz clic sobre las estrellas antes de que desaparezcan.</p>

</header>

<div class="info">

<div>Puntaje: <span id="score">0</span></div>

<div>Tiempo: <span id="time">30</span> s</div>

</div>

<div id="game"></div>

<button onclick="iniciarJuego()">🎮 Iniciar Juego</button>

<div id="mensajeFinal"></div>

<footer>

<h2>Integrantes del Grupo</h2>

<div class="integrantes">

⭐ Valeria Mantilla<br>
⭐ Dahiro Hernandez<br>
⭐ Valentina Medina

</div>

</footer>

</div>

<script>

let puntaje=0;
let tiempo=30;
let intervaloTiempo;
let intervaloEstrellas;
let jugando=false;

const game=document.getElementById("game");

function iniciarJuego(){

if(jugando)return;

jugando=true;

puntaje=0;
tiempo=30;

document.getElementById("score").innerHTML=puntaje;
document.getElementById("time").innerHTML=tiempo;
document.getElementById("mensajeFinal").innerHTML="";
game.innerHTML="";

intervaloTiempo=setInterval(()=>{

tiempo--;

document.getElementById("time").innerHTML=tiempo;

if(tiempo<=0){

finalizarJuego();

}

},1000);

intervaloEstrellas=setInterval(crearEstrella,600);

}

function crearEstrella(){

const estrella=document.createElement("div");

estrella.className="star";

estrella.innerHTML="⭐";

const x=Math.random()*(game.clientWidth-50);
const y=Math.random()*(game.clientHeight-50);

estrella.style.left=x+"px";
estrella.style.top=y+"px";

estrella.onclick=function(){

puntaje++;

document.getElementById("score").innerHTML=puntaje;

estrella.remove();

};

game.appendChild(estrella);

setTimeout(()=>{

if(estrella.parentNode){

estrella.remove();

}

},1500);

}

function finalizarJuego(){

clearInterval(intervaloTiempo);
clearInterval(intervaloEstrellas);

jugando=false;

game.innerHTML="";

let mensaje="";

if(puntaje<10){

mensaje="😅 ¡Buen intento! Sigue practicando.";

}else if(puntaje<20){

mensaje="👏 ¡Muy bien! Tienes buenos reflejos.";

}else{

mensaje="🏆 ¡INCREÍBLE! Eres un campeón.";

}

document.getElementById("mensajeFinal").innerHTML=

"Juego terminado<br><br>" +

"⭐ Puntaje final: <b>"+puntaje+"</b><br><br>"+

mensaje;

}

</script>

</body>
</html>
