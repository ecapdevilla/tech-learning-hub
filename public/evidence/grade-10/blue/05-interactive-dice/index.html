<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Dados y Tabla de Multiplicar</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .main-container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    header {
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
      font-size: 1.05rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 12px;
    }

    /* --- CONTROLES DADOS --- */
    .dice-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .dice-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 20px 0;
      min-height: 110px;
      align-items: center;
    }

    .dice {
      width: 90px;
      height: 90px;
      background-color: #ffffff;
      border: 3px solid #1e293b;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      transition: transform 0.3s ease;
    }

    .dot {
      background-color: #1e293b;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      align-self: center;
      justify-self: center;
      visibility: hidden;
    }

    .dice.rolling {
      animation: roll 0.6s ease-in-out;
    }

    @keyframes roll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-20deg) scale(1.15); }
      75% { transform: rotate(20deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Posiciones de los puntos */
    .d-1 .dot:nth-child(5) { visibility: visible; }
    .d-2 .dot:nth-child(1), .d-2 .dot:nth-child(9) { visibility: visible; }
    .d-3 .dot:nth-child(1), .d-3 .dot:nth-child(5), .d-3 .dot:nth-child(9) { visibility: visible; }
    .d-4 .dot:nth-child(1), .d-4 .dot:nth-child(3), .d-4 .dot:nth-child(7), .d-4 .dot:nth-child(9) { visibility: visible; }
    .d-5 .dot:nth-child(1), .d-5 .dot:nth-child(3), .d-5 .dot:nth-child(5), .d-5 .dot:nth-child(7), .d-5 .dot:nth-child(9) { visibility: visible; }
    .d-6 .dot:nth-child(1), .d-6 .dot:nth-child(3), .d-6 .dot:nth-child(4), .d-6 .dot:nth-child(6), .d-6 .dot:nth-child(7), .d-6 .dot:nth-child(9) { visibility: visible; }

    .dice-result {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 15px;
      min-height: 30px;
    }

    /* --- FORMULARIOS Y BOTONES --- */
    select, input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* --- TABLA DE MULTIPLICAR --- */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .quick-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .quick-buttons span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-chip {
      background-color: #e0e7ff;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: none;
    }

    .btn-chip:hover {
      background-color: var(--primary);
      color: white;
    }

    .table-container {
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      position: sticky;
      top: 0;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    footer strong {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <header>
      <h1>Simulador & Tabla Interactiva</h1>
      <p>Proyecto HTML, CSS y JavaScript para Visual Studio Code</p>
    </header>

    <!-- SIMULADOR DE DADOS -->
    <section class="card">
      <h2>🎲 Simulador de Dados</h2>
      
      <div class="dice-controls">
        <label for="diceCount">Cantidad de dados:</label>
        <select id="diceCount">
          <option value="1">1 Dado</option>
          <option value="2" selected>2 Dados</option>
        </select>
        <button id="rollBtn">Lanzar Dados</button>
      </div>

      <div class="dice-container" id="diceContainer">
        <!-- Generado dinámicamente -->
      </div>

      <div class="dice-result" id="diceResult">
        ¡Haz clic en "Lanzar Dados" para comenzar!
      </div>
    </section>

    <!-- TABLA DE MULTIPLICAR -->
    <section class="card">
      <h2>✖️ Tabla de Multiplicar Interactiva</h2>
      
      <div class="controls-grid">
        <div class="input-group">
          <label for="baseNum">Número de la tabla:</label>
          <input type="number" id="baseNum" value="7">
        </div>
        <div class="input-group">
          <label for="limitNum">Multiplicar hasta el:</label>
          <input type="number" id="limitNum" value="10" min="1" max="100">
        </div>
      </div>

      <div class="quick-buttons">
        <span>Accesos rápidos:</span>
        <button class="btn-chip" onclick="setTable(2)">Tabla del 2</button>
        <button class="btn-chip" onclick="setTable(5)">Tabla del 5</button>
        <button class="btn-chip" onclick="setTable(7)">Tabla del 7</button>
        <button class="btn-chip" onclick="setTable(10)">Tabla del 10</button>
        <button class="btn-chip" onclick="setTable(12)">Tabla del 12</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Operación</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- CRÉDITOS / DESARROLLADORES -->
    <footer>
      <p>Desarrollado por: <strong>Elise</strong> y <strong>Salomé Castro</strong></p>
    </footer>
  </div>

  <script>
    // ==========================================
    // LÓGICA DEL SIMULADOR DE DADOS
    // ==========================================
    const diceCountSelect = document.getElementById('diceCount');
    const rollBtn = document.getElementById('rollBtn');
    const diceContainer = document.getElementById('diceContainer');
    const diceResult = document.getElementById('diceResult');

    function createDiceHtml(val = 1) {
      return `
        <div class="dice d-${val}">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      `;
    }

    function initDice() {
      const count = parseInt(diceCountSelect.value);
      diceContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        diceContainer.innerHTML += createDiceHtml(1);
      }
    }

    rollBtn.addEventListener('click', () => {
      const count = parseInt(diceCountSelect.value);
      const diceElements = diceContainer.querySelectorAll('.dice');

      diceElements.forEach(d => d.classList.add('rolling'));
      rollBtn.disabled = true;

      setTimeout(() => {
        let total = 0;
        let results = [];

        diceContainer.innerHTML = '';

        for (let i = 0; i < count; i++) {
          const val = Math.floor(Math.random() * 6) + 1;
          results.push(val);
          total += val;
          diceContainer.innerHTML += createDiceHtml(val);
        }

        if (count === 1) {
          diceResult.textContent = `¡Obtuviste un ${results[0]}!`;
        } else {
          diceResult.textContent = `¡Obtuviste ${results.join(' + ')} = ${total}!`;
        }

        rollBtn.disabled = false;
      }, 600);
    });

    diceCountSelect.addEventListener('change', initDice);
    initDice();

    // ==========================================
    // LÓGICA DE LA TABLA DE MULTIPLICAR
    // ==========================================
    const baseNumInput = document.getElementById('baseNum');
    const limitNumInput = document.getElementById('limitNum');
    const tableBody = document.getElementById('tableBody');

    function renderTable() {
      const base = parseInt(baseNumInput.value) || 0;
      const limit = parseInt(limitNumInput.value) || 0;
      
      tableBody.innerHTML = '';

      if (limit < 1) {
        tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8;">Ingresa un límite mayor a 0</td></tr>';
        return;
      }

      for (let i = 1; i <= limit; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${base} × ${i}</td>
          <td><strong>${base * i}</strong></td>
        `;
        tableBody.appendChild(tr);
      }
    }

    function setTable(num) {
      baseNumInput.value = num;
      renderTable();
    }

    baseNumInput.addEventListener('input', renderTable);
    limitNumInput.addEventListener('input', renderTable);

    renderTable();
  </script>
</body>
</html>
