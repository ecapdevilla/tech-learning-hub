<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dado Aleatorio - Angelo y Samuel</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #d8e8ff;
            margin-bottom: 30px;
            font-size: 18px;
        }

        /* DADO */

        .zona-dado {
            width: 220px;
            height: 220px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        .dado {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(15deg);
        }

        .cara {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(145deg, #ffffff, #d8d8d8);
            border: 4px solid #bcbcbc;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
        }

        .frente {
            transform: translateZ(75px);
        }

        .atras {
            transform: rotateY(180deg) translateZ(75px);
        }

        .derecha {
            transform: rotateY(90deg) translateZ(75px);
        }

        .izquierda {
            transform: rotateY(-90deg) translateZ(75px);
        }

        .arriba {
            transform: rotateX(90deg) translateZ(75px);
        }

        .abajo {
            transform: rotateX(-90deg) translateZ(75px);
        }

        /* ANIMACIÓN */

        .girando {
            animation: girarDado 1s ease-in-out;
        }

        @keyframes girarDado {

            0% {
                transform: rotateX(0deg)
                           rotateY(0deg)
                           rotateZ(0deg);
            }

            25% {
                transform: rotateX(180deg)
                           rotateY(180deg)
                           rotateZ(90deg);
            }

            50% {
                transform: rotateX(360deg)
                           rotateY(360deg)
                           rotateZ(180deg);
            }

            75% {
                transform: rotateX(540deg)
                           rotateY(540deg)
                           rotateZ(270deg);
            }

            100% {
                transform: rotateX(720deg)
                           rotateY(720deg)
                           rotateZ(360deg);
            }
        }

        /* RESULTADO */

        .resultado {
            margin: 20px auto;
            background: rgba(0,0,0,0.25);
            border-radius: 15px;
            padding: 20px;
            max-width: 500px;
        }

        .resultado h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #numeroResultado {
            font-size: 55px;
            font-weight: bold;
            color: #ffd700;
        }

        /* BOTONES */

        .botones {
            margin: 25px 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .btn-lanzar {
            background: #00c853;
        }

        .btn-lanzar:hover {
            background: #00e676;
            transform: translateY(-3px);
        }

        .btn-diez {
            background: #1976d2;
        }

        .btn-diez:hover {
            background: #2196f3;
            transform: translateY(-3px);
        }

        .btn-borrar {
            background: #e53935;
        }

        .btn-borrar:hover {
            background: #ff5252;
            transform: translateY(-3px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* HISTORIAL */

        .historial {
            margin-top: 30px;
            background: rgba(0,0,0,0.20);
            border-radius: 18px;
            padding: 25px;
        }

        .historial h2 {
            margin-bottom: 20px;
        }

        #listaResultados {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 55px;
        }

        .resultado-historial {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: white;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: aparecer 0.4s ease;
        }

        @keyframes aparecer {

            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

        .vacio {
            color: #ccc;
            font-style: italic;
        }

        /* INFORMACIÓN */

        .contador {
            margin-top: 18px;
            font-size: 17px;
            color: #d8e8ff;
        }

        .mensaje {
            margin-top: 12px;
            min-height: 24px;
            color: #ffd700;
            font-weight: bold;
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .estadistica {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 12px;
        }

        .estadistica span {
            display: block;
            font-size: 25px;
            font-weight: bold;
            color: #ffd700;
        }

        .estadistica small {
            color: #d8e8ff;
        }

        /* FOOTER */

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        footer p {
            color: #d8e8ff;
            margin: 5px;
        }

        footer strong {
            color: white;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitulo {
                font-size: 15px;
            }

            .zona-dado {
                transform: scale(0.85);
            }

            .botones {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .estadisticas {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🎲 DADO ALEATORIO 🎲</h1>

        <p class="subtitulo">
            Lanza el dado una vez o realiza 10 lanzamientos
        </p>


        <!-- DADO -->

        <div class="zona-dado">

            <div class="dado" id="dado">

                <div class="cara frente">🎲</div>
                <div class="cara atras">🎲</div>
                <div class="cara derecha">🎲</div>
                <div class="cara izquierda">🎲</div>
                <div class="cara arriba">🎲</div>
                <div class="cara abajo">🎲</div>

            </div>

        </div>


        <!-- RESULTADO -->

        <div class="resultado">

            <h2>Resultado</h2>

            <div id="numeroResultado">
                -
            </div>

            <div class="mensaje" id="mensaje">
                Presiona un botón para comenzar
            </div>

        </div>


        <!-- BOTONES -->

        <div class="botones">

            <button
                class="btn-lanzar"
                id="btnLanzar"
                onclick="lanzarDado()">

                🎲 LANZAR 1 VEZ

            </button>


            <button
                class="btn-diez"
                id="btnDiez"
                onclick="lanzarDiez()">

                🎯 TIRAR 10 VECES

            </button>


            <button
                class="btn-borrar"
                onclick="borrarHistorial()">

                🗑️ BORRAR HISTORIAL

            </button>

        </div>


        <!-- HISTORIAL -->

        <div class="historial">

            <h2>📋 Historial de lanzamientos</h2>

            <div id="listaResultados">

                <span class="vacio">
                    Todavía no has lanzado el dado.
                </span>

            </div>


            <div class="contador">

                Lanzamientos realizados:
                <strong id="contador">0</strong>

            </div>


            <!-- ESTADÍSTICAS -->

            <div class="estadisticas">

                <div class="estadistica">

                    <span id="mayor">-</span>

                    <small>
                        Número mayor
                    </small>

                </div>


                <div class="estadistica">

                    <span id="menor">-</span>

                    <small>
                        Número menor
                    </small>

                </div>


                <div class="estadistica">

                    <span id="promedio">-</span>

                    <small>
                        Promedio
                    </small>

                </div>

            </div>

        </div>


        <!-- DESARROLLADORES -->

        <footer>

            <p>
                Desarrollado por:
            </p>

            <p>
                <strong>Angelo</strong>
                y
                <strong>Samuel</strong>
            </p>

        </footer>

    </div>


    <script>

        // ==========================================
        // VARIABLES
        // ==========================================

        let historial = [];

        const dado =
            document.getElementById("dado");

        const numeroResultado =
            document.getElementById("numeroResultado");

        const listaResultados =
            document.getElementById("listaResultados");

        const contador =
            document.getElementById("contador");

        const mensaje =
            document.getElementById("mensaje");

        const btnLanzar =
            document.getElementById("btnLanzar");

        const btnDiez =
            document.getElementById("btnDiez");

        const mayor =
            document.getElementById("mayor");

        const menor =
            document.getElementById("menor");

        const promedio =
            document.getElementById("promedio");


        // ==========================================
        // LANZAR UNA VEZ
        // ==========================================

        function lanzarDado() {

            // Desactivar botones

            btnLanzar.disabled = true;
            btnDiez.disabled = true;


            // Comenzar animación

            dado.classList.remove("girando");

            void dado.offsetWidth;

            dado.classList.add("girando");


            numeroResultado.textContent = "🎲";

            mensaje.textContent =
                "El dado está girando...";


            // Esperar la animación

            setTimeout(function() {

                // Número aleatorio del 1 al 6

                const resultado =
                    Math.floor(Math.random() * 6) + 1;


                // Mostrar resultado

                numeroResultado.textContent =
                    resultado;


                mensaje.textContent =
                    "¡Resultado obtenido!";


                // Guardar

                historial.push(resultado);


                // Actualizar

                actualizarHistorial();


                // Activar botones

                btnLanzar.disabled = false;
                btnDiez.disabled = false;

            }, 1000);

        }


        // ==========================================
        // TIRAR 10 VECES
        // ==========================================

        function lanzarDiez() {

            btnLanzar.disabled = true;
            btnDiez.disabled = true;

            let cantidad = 0;


            mensaje.textContent =
                "Realizando 10 lanzamientos...";


            // Función para hacer cada lanzamiento

            function siguienteLanzamiento() {

                if (cantidad >= 10) {

                    mensaje.textContent =
                        "🎉 ¡Los 10 lanzamientos terminaron!";

                    btnLanzar.disabled = false;
                    btnDiez.disabled = false;

                    return;

                }


                // Animación

                dado.classList.remove("girando");

                void dado.offsetWidth;

                dado.classList.add("girando");


                numeroResultado.textContent = "🎲";


                // Esperar a que gire

                setTimeout(function() {

                    // Resultado aleatorio

                    const resultado =
                        Math.floor(Math.random() * 6) + 1;


                    // Mostrar

                    numeroResultado.textContent =
                        resultado;


                    // Guardar

                    historial.push(resultado);


                    // Aumentar contador

                    cantidad++;


                    // Actualizar historial

                    actualizarHistorial();


                    mensaje.textContent =
                        "Lanzamiento " +
                        cantidad +
                        " de 10";


                    // Hacer siguiente lanzamiento

                    setTimeout(
                        siguienteLanzamiento,
                        300
                    );

                }, 1000);

            }


            // Comenzar

            siguienteLanzamiento();

        }


        // ==========================================
        // ACTUALIZAR HISTORIAL
        // ==========================================

        function actualizarHistorial() {

            listaResultados.innerHTML = "";


            if (historial.length === 0) {

                listaResultados.innerHTML =
                    '<span class="vacio">' +
                    'Todavía no has lanzado el dado.' +
                    '</span>';

                contador.textContent = "0";

                mayor.textContent = "-";
                menor.textContent = "-";
                promedio.textContent = "-";

                return;
            }


            // Crear resultados

            historial.forEach(function(numero, indice) {

                const elemento =
                    document.createElement("div");


                elemento.classList.add(
                    "resultado-historial"
                );


                elemento.textContent =
                    numero;


                elemento.title =
                    "Lanzamiento " +
                    (indice + 1);


                listaResultados.appendChild(
                    elemento
                );

            });


            // Contador

            contador.textContent =
                historial.length;


            // Mayor

            mayor.textContent =
                Math.max(...historial);


            // Menor

            menor.textContent =
                Math.min(...historial);


            // Promedio

            const suma =
                historial.reduce(
                    (total, numero) =>
                    total + numero,
                    0
                );


            const media =
                suma / historial.length;


            promedio.textContent =
                media.toFixed(2);

        }


        // ==========================================
        // BORRAR HISTORIAL
        // ==========================================

        function borrarHistorial() {

            historial = [];

            numeroResultado.textContent = "-";

            mensaje.textContent =
                "Historial borrado correctamente.";

            actualizarHistorial();

        }


        // ==========================================
        // TECLA ESPACIO
        // ==========================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "Space") {

                    event.preventDefault();

                    if (!btnLanzar.disabled) {

                        lanzarDado();

                    }

                }

            }
        );

    </script>

</body>
</html>}
